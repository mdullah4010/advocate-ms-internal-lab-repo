name: Test Azure OIDC Login

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Log in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Confirm Azure login
        run: |
          az account show --output table

      - name: Confirm Azure subscription
        run: |
          az account show --query "{Subscription:name, State:state}" --output table

      - name: Test Azure read access
        run: |
          az group list --query "[].{ResourceGroup:name, Location:location}" --output table
