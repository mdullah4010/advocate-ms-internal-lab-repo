name: Terraform Module Deployment Test

on:
  workflow_dispatch:
    inputs:
      module_name:
        description: Module directory name under modules (for example, virtual-network)
        required: true
        type: string
      confirmation:
        description: Confirm that temporary test resources may be deployed and destroyed
        required: true
        type: choice
        options:
          - DEPLOY-AND-DESTROY

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-module-test-${{ inputs.module_name }}
  cancel-in-progress: false

jobs:
  deploy-verify-destroy:
    name: Test ${{ inputs.module_name }} module
    runs-on: self-hosted
    timeout-minutes: 60

    defaults:
      run:
        shell: bash

    env:
      MODULE_NAME: ${{ inputs.module_name }}
      TEST_DIR: modules/${{ inputs.module_name }}/test
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_location: westus3
      TF_VAR_test_run_id: ${{ github.run_id }}
      TFSTATE_KEY: advocate/test/${{ inputs.module_name }}-module-test.tfstate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require main branch
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "This deployment test must be dispatched from main." >&2
            exit 1
          fi

      - name: Validate module test directory
        run: |
          if [[ ! "$MODULE_NAME" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
            echo "Module name may contain only lowercase letters, numbers, and hyphens." >&2
            exit 1
          fi

          if [[ ! -d "$TEST_DIR" ]]; then
            echo "Test directory does not exist: $TEST_DIR" >&2
            exit 1
          fi

          if ! compgen -G "$TEST_DIR/*.tf" > /dev/null; then
            echo "No Terraform files were found in $TEST_DIR." >&2
            exit 1
          fi

          echo "Testing module '$MODULE_NAME' from '$TEST_DIR'."

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.1"

      - name: Log in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify configuration
        run: |
          test -n "$ARM_CLIENT_ID" || { echo "AZURE_CLIENT_ID is not configured." >&2; exit 1; }
          test -n "$ARM_TENANT_ID" || { echo "AZURE_TENANT_ID is not configured." >&2; exit 1; }
          test -n "$ARM_SUBSCRIPTION_ID" || { echo "AZURE_SUBSCRIPTION_ID is not configured." >&2; exit 1; }
          test -n "${{ vars.TFSTATE_RESOURCE_GROUP }}" || { echo "TFSTATE_RESOURCE_GROUP is not configured." >&2; exit 1; }
          test -n "${{ vars.TFSTATE_STORAGE_ACCOUNT }}" || { echo "TFSTATE_STORAGE_ACCOUNT is not configured." >&2; exit 1; }
          test -n "${{ vars.TFSTATE_CONTAINER }}" || { echo "TFSTATE_CONTAINER is not configured." >&2; exit 1; }
          test -n "${{ vars.TFSTATE_SUBSCRIPTION_ID }}" || { echo "TFSTATE_SUBSCRIPTION_ID is not configured." >&2; exit 1; }

      - name: Verify private backend connectivity
        run: |
          backend_host="${{ vars.TFSTATE_STORAGE_ACCOUNT }}.blob.core.windows.net"
          backend_ip="$(getent ahostsv4 "$backend_host" | awk 'NR == 1 { print $1 }')"
          echo "$backend_host resolves to $backend_ip"

          if [[ ! "$backend_ip" =~ ^10\. &&
                ! "$backend_ip" =~ ^192\.168\. &&
                ! "$backend_ip" =~ ^172\.(1[6-9]|2[0-9]|3[01])\. ]]; then
            echo "The backend hostname did not resolve to an RFC 1918 private address." >&2
            exit 1
          fi

          http_code="$(curl --silent --show-error --output /dev/null \
            --write-out "%{http_code}" "https://$backend_host/")"
          echo "Azure Blob endpoint HTTP status: $http_code"
          test "$http_code" != "000"

      - name: Check formatting
        run: terraform fmt -check -recursive "modules/$MODULE_NAME"

      - name: Initialize remote backend
        id: init
        run: >-
          terraform -chdir="$TEST_DIR" init -reconfigure -input=false
          -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}"
          -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}"
          -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}"
          -backend-config="key=$TFSTATE_KEY"
          -backend-config="subscription_id=${{ vars.TFSTATE_SUBSCRIPTION_ID }}"
          -backend-config="tenant_id=$ARM_TENANT_ID"
          -backend-config="use_oidc=true"
          -backend-config="use_azuread_auth=true"

      - name: Validate
        run: terraform -chdir="$TEST_DIR" validate -no-color

      - name: Create saved plan
        run: terraform -chdir="$TEST_DIR" plan -input=false -no-color -out=tfplan

      - name: Apply saved plan
        id: apply
        run: terraform -chdir="$TEST_DIR" apply -input=false -auto-approve tfplan

      - name: Verify module outputs and remote state
        if: ${{ steps.apply.outcome == 'success' }}
        run: |
          terraform -chdir="$TEST_DIR" output -no-color
          terraform -chdir="$TEST_DIR" state list

          az storage blob show \
            --account-name "${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
            --container-name "${{ vars.TFSTATE_CONTAINER }}" \
            --name "$TFSTATE_KEY" \
            --auth-mode login \
            --output table

      - name: Destroy temporary resources
        id: cleanup
        if: ${{ always() && steps.init.outcome == 'success' }}
        run: |
          terraform -chdir="$TEST_DIR" destroy -input=false -auto-approve

          if [[ -n "$(terraform -chdir="$TEST_DIR" state list)" ]]; then
            echo "Remote state still contains managed resources after destroy." >&2
            terraform -chdir="$TEST_DIR" state list
            exit 1
          fi

      - name: Write job summary
        if: ${{ always() }}
        run: |
          {
            echo "## Terraform module deployment test"
            echo
            echo "- Module: $MODULE_NAME"
            echo "- Apply result: ${{ steps.apply.outcome }}"
            echo "- Cleanup result: ${{ steps.cleanup.outcome }}"
            echo "- State key: $TFSTATE_KEY"
          } >> "$GITHUB_STEP_SUMMARY"
