name: Temporary Connectivity Deployment Test

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Confirm that the test resources may be deployed and destroyed
        required: true
        type: choice
        options:
          - DEPLOY-AND-DESTROY

permissions:
  contents: read
  id-token: write

concurrency:
  group: connectivity-local-state-test
  cancel-in-progress: false

jobs:
  deploy-verify-destroy:
    name: Deploy, verify, and destroy connectivity
    runs-on: self-hosted
    timeout-minutes: 60

    defaults:
      run:
        shell: bash
        working-directory: terraform/landing-zones/Platform/Connectivity

    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TFVARS_FILE: ${{ github.workspace }}/terraform/environments/test/connectivity.tfvars

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require main branch
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "This deployment test must be dispatched from the main branch." >&2
            exit 1
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.1"

      - name: Log in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Confirm Azure login
        run: az account show --output table

      - name: Confirm Azure subscription
        run: az account show --query "{Subscription:name, State:state}" --output table

      - name: Test Azure read access
        run: az group list --query "[].{ResourceGroup:name, Location:location}" --output table

      - name: Verify test configuration
        run: |
          test -f "$TFVARS_FILE" || {
            echo "Missing test configuration: $TFVARS_FILE" >&2
            exit 1
          }

      - name: Check formatting
        run: terraform fmt -check -recursive "${{ github.workspace }}/terraform"

      - name: Initialize local backend
        run: terraform init -reconfigure -input=false

      - name: Validate
        run: terraform validate -no-color

      - name: Create saved plan
        run: terraform plan -input=false -no-color -var-file="$TFVARS_FILE" -out=tfplan

      - name: Apply saved plan
        id: apply
        run: terraform apply -input=false -auto-approve tfplan

      - name: Verify deployed virtual network
        if: ${{ steps.apply.outcome == 'success' }}
        run: |
          terraform output -no-color
          az network vnet show \
            --resource-group "$(terraform output -raw resource_group_name)" \
            --name "$(terraform output -raw hub_virtual_network_name)" \
            --query "{name:name,location:location,addressSpace:addressSpace.addressPrefixes,provisioningState:provisioningState}" \
            --output table

      - name: Destroy temporary resources
        id: cleanup
        if: ${{ always() }}
        run: |
          if [[ -f terraform.tfstate ]]; then
            terraform destroy \
              -input=false \
              -auto-approve \
              -var-file="$TFVARS_FILE"
          else
            echo "No local Terraform state exists; cleanup is not required."
          fi

      - name: Upload emergency state when cleanup fails
        if: ${{ always() && steps.cleanup.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: emergency-connectivity-state-${{ github.run_id }}
          path: |
            terraform/landing-zones/Platform/Connectivity/terraform.tfstate
            terraform/landing-zones/Platform/Connectivity/terraform.tfstate.backup
          if-no-files-found: warn
          retention-days: 1

      - name: Write job summary
        if: ${{ always() }}
        run: |
          {
            echo "## Temporary connectivity deployment"
            echo
            echo "- Apply result: ${{ steps.apply.outcome }}"
            echo "- Cleanup result: ${{ steps.cleanup.outcome }}"
            echo "- Local state was scoped to this job."
          } >> "$GITHUB_STEP_SUMMARY"
